name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch is master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # (Optional) If you use Node.js frameworks like React, Vue, Vite, etc., 
      # uncomment the block below to install dependencies and build your project.
      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - name: Install Dependencies & Build
      #   run: |
      #     npm ci
      #     npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }} # Leave this if using FIREBASE_TOKEN below, or use service account setup
          channelId: live
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}